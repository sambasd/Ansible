---
- name: Install Apache on frontend servers
  hosts: frontend
  become: yes
  tasks:
    - name: Install multiple packages
      ansible.builtin.package:
        name:
          - httpd          # Apache web server
          - mariadb-server # Database server
          - php
          - git
          - wget
          - curl
          - unzip
          - vim
          - net-tools
          - telnet
          - nginx
        state: present
    - name: Ensure Apache is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
